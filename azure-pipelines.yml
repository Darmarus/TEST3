name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
- master

resources:
- repo: self

variables:
  solution: '**/*.sln'
  buildConfiguration: 'Debug'
  buildVersion: '$(Build.BuildNumber)'

stages:
- stage: Build_Test
  displayName: Build and test
  jobs:
  - job: Build_Test
    displayName: Build and test
    timeoutInMinutes: 300
    pool:
      name: Default

    steps:
    - checkout: self
      clean: true

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: '$(solution)'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: '$(solution)'
        arguments: >
          --configuration $(buildConfiguration)
          --no-restore
          /p:Version=$(buildVersion)
          /p:AssemblyVersion=$(buildVersion)
          /p:FileVersion=$(buildVersion)
          /p:InformationalVersion=$(buildVersion)
          /p:GeneratePackageOnBuild=true

    - powershell: |
        if (Get-ChildItem -Recurse -Filter *.UnitTest.csproj -File) {
          Write-Host "##vso[task.setVariable variable=RunUnitTests]True"
        }
        else {
          Write-Host "##vso[task.setVariable variable=RunUnitTests]False"
        }
      displayName: Discover unit tests

    - task: DotNetCoreCLI@2
      condition: and(succeeded(), eq(variables['RunUnitTests'], 'True'))
      displayName: Run unit tests
      inputs:
        command: test
        projects: '**/*.UnitTest.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'

    - task: DotNetCoreCLI@2
      displayName: Pack NuGet packages
      inputs:
        command: pack
        packagesToPack: '**/*.csproj'
        nobuild: true
        versioningScheme: byEnvVar
        versionEnvVar: buildVersion
        arguments: >
          --configuration $(buildConfiguration)
          --output $(Build.ArtifactStagingDirectory)

    - publish: $(Build.ArtifactStagingDirectory)
      displayName: Publish artifacts
      artifact: SamplesArtifacts

- stage: Deploy
  displayName: Deploy
  dependsOn: Build_Test
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: Push NuGet packages to Azure Artifacts
    pool:
      name: Default

    steps:
    - checkout: none

    - download: current
      artifact: SamplesArtifacts

    - task: NuGetToolInstaller@1
      displayName: Install NuGet

    - task: NuGetCommand@2
      displayName: Push packages to Azure Artifacts
      inputs:
        command: push
        nuGetFeedType: internal
        publishVstsFeed: 'NAZWA_TWOJEGO_FEEDA'
        packagesToPush: '$(Agent.BuildDirectory)/SamplesArtifacts/**/*.nupkg'