name: $(date:yy).$(date:MM).$(Build.BuildId).$(date:dd)   # <-- DODANE: X.Y.Z.A dla byBuildNumber

trigger:
- master

pool:
  name: Default
  demands:
  - msbuild
  - visualstudio

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'

- task: DotNetCoreCLI@2       # <-- POPRAWIONE: był DotNetCoreCLI@2
  inputs:
    FileNames: |
      **\AssemblyInfo.cs
      **\AssemblyInfo.vb
      **\GlobalInfo.vb
      **\GlobalInfo.cs
    InsertAttributes: true
    WriteBOM: true
    Title: '$(Build.DefinitionName)'
    Product: '$(Build.DefinitionName)'
    Company: 'Agemit Sp. z o.o.'
    Copyright: 'Copyright © $(date:DD MMMM YYYY) Agemit Sp. z o.o.'
    Trademark: 'MD'
    VersionNumber: '$(Build.BuildNumber)'
    FileVersionNumber: '$(Build.BuildNumber)'
    InformationalVersion: '$(Build.BuildNumber)'

- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

- task: PublishSymbols@2
  displayName: 'Publish symbols path'
  inputs:
    SearchPattern: '**\bin\**\*.pdb'
    PublishSymbols: false
  continueOnError: true



- task: CopyFiles@2
  displayName: 'Copy Files to: $(build.artifactstagingdirectory)'
  inputs:
    SourceFolder: '$(system.defaultworkingdirectory)'
    Contents: '**\bin\Release\**'
    TargetFolder: '$(build.artifactstagingdirectory)'   # <-- POPRAWIONE: było puste
  condition: succeededOrFailed()

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop'
  inputs:
    PathtoPublish: '$(build.artifactstagingdirectory)'
  condition: succeededOrFailed()