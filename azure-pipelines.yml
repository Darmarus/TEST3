name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
- master

resources:
- repo: self

variables:
  solution: '**/*.sln'
  buildConfiguration: 'Debug'
  packageVersion: '1.0.$(Build.BuildId)'
  assemblyVersion: '1.0.0.0'
  fileVersion: '1.0.$(Build.BuildId).0'

stages:
- stage: Build_Test
  displayName: Build and test
  jobs:
  - job: Build_Test
    displayName: Build and test
    timeoutInMinutes: 300
    pool:
      name: Default

    steps:
    - checkout: self
      clean: true

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: '$(solution)'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: '$(solution)'
        arguments: >
          --configuration $(buildConfiguration)
          --no-restore
          /p:Version=$(packageVersion)
          /p:AssemblyVersion=$(assemblyVersion)
          /p:FileVersion=$(fileVersion)
          /p:InformationalVersion=$(Build.BuildNumber)

    - powershell: |
        if (Get-ChildItem -Recurse -Filter *.UnitTest.csproj -File) {
          Write-Host "##vso[task.setVariable variable=RunUnitTests]True"
        }
        else {
          Write-Host "##vso[task.setVariable variable=RunUnitTests]False"
        }
      displayName: Discover unit tests

    - task: DotNetCoreCLI@2
      condition: and(succeeded(), eq(variables['RunUnitTests'], 'True'))
      displayName: Run unit tests
      inputs:
        command: test
        projects: '**/*.UnitTest.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'

    - powershell: |
        $artifactPath = "$(Build.ArtifactStagingDirectory)\dll"
        New-Item -ItemType Directory -Force -Path $artifactPath | Out-Null

        $dlls = Get-ChildItem -Path "$(Build.SourcesDirectory)" -Recurse -Filter *.dll |
          Where-Object {
            $_.FullName -like "*\bin\$(buildConfiguration)\*" -and
            $_.FullName -notlike "*\obj\*" -and
            $_.Name -notlike "*.resources.dll" -and
            $_.Name -notlike "*Test*.dll"
          }

        if (-not $dlls) {
          Write-Error "No DLL files found in bin\$(buildConfiguration)."
          exit 1
        }

        foreach ($dll in $dlls) {
          Write-Host "Copying DLL: $($dll.FullName)"
          Copy-Item $dll.FullName -Destination $artifactPath -Force
        }

        Write-Host "Published DLL files:"
        Get-ChildItem -Path $artifactPath -Recurse
      displayName: Copy DLL files to artifacts

    - publish: $(Build.ArtifactStagingDirectory)\dll
      displayName: Publish DLL artifact
      artifact: DllArtifacts