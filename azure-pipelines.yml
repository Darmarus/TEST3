name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
- master

resources:
- repo: self

variables:
  projects: '**/*.csproj'
  buildConfiguration: 'Debug'
  packageVersion: '1.0.$(Build.BuildId)'
  assemblyVersion: '1.0.0.0'
  fileVersion: '1.0.$(Build.BuildId).0'
  artifactName: 'SamplesArtifacts'

stages:
- stage: Build_Test
  displayName: Build and test
  jobs:
  - job: Build
    displayName: Build
    timeoutInMinutes: 300
    pool:
      name: Default
      demands:
      - dotnet

    steps:
    - checkout: self
      clean: true

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: '$(projects)'

    - task: DotNetCoreCLI@2
      displayName: Build and generate packages
      inputs:
        command: build
        projects: '$(projects)'
        arguments: >
          --configuration $(buildConfiguration)
          --no-restore
          /p:GeneratePackageOnBuild=true
          /p:Version=$(packageVersion)
          /p:AssemblyVersion=$(assemblyVersion)
          /p:FileVersion=$(fileVersion)
          /p:InformationalVersion=$(Build.BuildNumber)

    - publish: $(System.DefaultWorkingDirectory)\bin
      displayName: Publish artifacts
      artifact: $(artifactName)

  - job: Tests
    displayName: Tests
    dependsOn: Build
    timeoutInMinutes: 300
    pool:
      name: Default
      demands:
      - vstest

    steps:
    - checkout: self
      clean: false

    - powershell: |
        if (Get-ChildItem -Recurse -Filter *.UnitTest.csproj -File) {
          Write-Host "##vso[task.setVariable variable=RunUnitTests]True"
        }
        else {
          Write-Host "##vso[task.setVariable variable=RunUnitTests]False"
        }
      displayName: Discover unit tests

    - task: DotNetCoreCLI@2
      condition: and(succeeded(), eq(variables['RunUnitTests'], 'True'))
      displayName: Run unit tests
      inputs:
        command: test
        projects: '**/*.UnitTest.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'

    - powershell: Start-SonetaTestInfrastructure
      displayName: Starts integration tests infrastructure
      continueOnError: true

    - task: VisualStudioTestPlatformInstaller@1
      displayName: Visual Studio Test Platform Installer
      inputs:
        packageFeedSelector: nugetOrg
        versionSelector: latestStable

    - task: VSTest@2
      displayName: VsTest - test assemblies
      continueOnError: true
      inputs:
        testSelector: testAssemblies
        testAssemblyVer2: |
          **\*test*.dll
          !**\*TestAdapter.dll
          !**\obj\**
        searchFolder: $(System.DefaultWorkingDirectory)
        vsTestVersion: toolsInstaller

    - powershell: Stop-SonetaTestInfrastructure
      displayName: Stops integration tests infrastructure
      condition: always()
      continueOnError: true