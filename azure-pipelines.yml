name: $(Date:yyyyMMdd).$(Rev:r)

trigger:
- master

resources:
- repo: self

variables:
  solution: '**/*.sln'
  buildConfiguration: 'Debug'
  packageVersion: '1.0.$(Build.BuildId)'
  assemblyVersion: '1.0.0.0'
  fileVersion: '1.0.$(Build.BuildId).0'

stages:
- stage: Build_Test
  displayName: Build and test
  jobs:
  - job: Build_Test
    displayName: Build and test
    timeoutInMinutes: 300
    pool:
      name: Default

    steps:
    - checkout: self
      clean: true

    - task: DotNetCoreCLI@2
      displayName: Restore
      inputs:
        command: restore
        projects: '$(solution)'

    - task: DotNetCoreCLI@2
      displayName: Build
      inputs:
        command: build
        projects: '$(solution)'
        arguments: >
          --configuration $(buildConfiguration)
          --no-restore
          /p:Version=$(packageVersion)
          /p:PackageVersion=$(packageVersion)
          /p:AssemblyVersion=$(assemblyVersion)
          /p:FileVersion=$(fileVersion)
          /p:InformationalVersion=$(Build.BuildNumber)
          /p:GeneratePackageOnBuild=true

    - powershell: |
        if (Get-ChildItem -Recurse -Filter *.UnitTest.csproj -File) {
          Write-Host "##vso[task.setVariable variable=RunUnitTests]True"
        }
        else {
          Write-Host "##vso[task.setVariable variable=RunUnitTests]False"
        }
      displayName: Discover unit tests

    - task: DotNetCoreCLI@2
      condition: and(succeeded(), eq(variables['RunUnitTests'], 'True'))
      displayName: Run unit tests
      inputs:
        command: test
        projects: '**/*.UnitTest.csproj'
        arguments: '--configuration $(buildConfiguration) --no-build'

    - powershell: |
        New-Item -ItemType Directory -Force -Path "$(Build.ArtifactStagingDirectory)" | Out-Null

        $packages = Get-ChildItem -Path "$(Build.SourcesDirectory)" -Recurse -Filter *.nupkg |
          Where-Object { $_.FullName -notlike "*\obj\*" }

        if (-not $packages) {
          Write-Error "No .nupkg files found. Check whether the project is packable and GeneratePackageOnBuild is enabled."
          exit 1
        }

        foreach ($package in $packages) {
          Write-Host "Copying package: $($package.FullName)"
          Copy-Item $package.FullName -Destination "$(Build.ArtifactStagingDirectory)" -Force
        }

        Write-Host "Packages in artifact staging directory:"
        Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)" -Recurse
      displayName: Copy NuGet packages to artifacts

    - publish: $(Build.ArtifactStagingDirectory)
      displayName: Publish artifacts
      artifact: SamplesArtifacts

- stage: Deploy
  displayName: Deploy
  dependsOn: Build_Test
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: Push NuGet packages to Azure Artifacts
    pool:
      name: Default

    steps:
    - checkout: none

    - download: current
      artifact: SamplesArtifacts

    - task: NuGetToolInstaller@1
      displayName: Install NuGet

    - task: NuGetCommand@2
      displayName: Push packages to Azure Artifacts
      inputs:
        command: push
        nuGetFeedType: internal
        publishVstsFeed: 'TEST'
        packagesToPush: '$(Agent.BuildDirectory)/SamplesArtifacts/**/*.nupkg'